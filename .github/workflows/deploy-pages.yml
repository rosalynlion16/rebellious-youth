name: Deploy Rebellious Youth test site

on:
  push:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout artwork branch
        uses: actions/checkout@v4
        with:
          ref: dev
          path: source

      - name: Restore playable snapshot
        uses: actions/checkout@v4
        with:
          ref: web-snapshot
          path: _site

      - name: Install original True Ending PNG artwork
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _site/true-ending
          cp source/cg_true01_kapok_call.png _site/true-ending/cg_true01_kapok_call.png
          cp source/cg_true02_airport_group.png _site/true-ending/cg_true02_airport_group.png
          cp source/cg_true02_airport_goodbye.png _site/true-ending/cg_true02_airport_goodbye.png
          cp source/lin_23_game_sprite.png _site/true-ending/lin_23_game_sprite.png
          cp source/zeng_23_game_sprite.png _site/true-ending/zeng_23_game_sprite.png
          cp source/rain_22_game_sprite.png _site/true-ending/rain_22_game_sprite.png
          cp source/shop_master_normal.png _site/true-ending/shop_master_normal.png
          python - <<'PY'
          from pathlib import Path
          p=Path('_site/true-ending/true-ending.js')
          s=p.read_text(encoding='utf-8')
          for name in ['cg_true01_kapok_call','cg_true02_airport_group','cg_true02_airport_goodbye','lin_23_game_sprite','zeng_23_game_sprite','rain_22_game_sprite']:
              s=s.replace(name+'.webp',name+'.png')
          s=s.replace('supervisor_normal.webp','shop_master_normal.png')
          p.write_text(s,encoding='utf-8')
          PY
          file _site/true-ending/*.png
          test -s _site/true-ending/lin_23_game_sprite.png
          test -s _site/true-ending/zeng_23_game_sprite.png
          test -s _site/true-ending/rain_22_game_sprite.png
          test -s _site/true-ending/shop_master_normal.png

      - name: Keep GitHub Pages project paths valid
        shell: bash
        run: |
          set -euo pipefail
          touch _site/.nojekyll
          grep -q '/rebellious-youth/' _site/index.html || true

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
