name: Deploy Rebellious Youth test site

on:
  push:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout artwork branch
        uses: actions/checkout@v4
        with:
          ref: dev
          path: source
      - name: Checkout latest main artwork
        uses: actions/checkout@v4
        with:
          ref: main
          path: main-source
      - name: Restore playable snapshot
        uses: actions/checkout@v4
        with:
          ref: web-snapshot
          path: _site
      - name: Keep True Ending artwork current
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _site/true-ending
          cp source/cg_true01_kapok_call.png _site/true-ending/cg_true01_kapok_call.png
          cp source/cg_true02_airport_group.png _site/true-ending/cg_true02_airport_group.png
          cp source/cg_true02_airport_goodbye.png _site/true-ending/cg_true02_airport_goodbye.png
          cp source/lin_23_game_sprite.png _site/true-ending/lin_23_game_sprite.png
          cp source/zeng_23_game_sprite.png _site/true-ending/zeng_23_game_sprite.png
          cp source/rain_22_game_sprite.png _site/true-ending/rain_22_game_sprite.png
          cp main-source/bg_airport_departure_day.png _site/true-ending/bg_airport_departure_day.png
          cp main-source/shop_master_normal.png _site/true-ending/shop_master_normal.png
          python - <<'PY'
          from pathlib import Path
          js=Path('_site/true-ending/true-ending.js'); s=js.read_text(encoding='utf-8')
          for name in ['cg_true01_kapok_call','cg_true02_airport_group','cg_true02_airport_goodbye','lin_23_game_sprite','zeng_23_game_sprite','rain_22_game_sprite']:
              s=s.replace(name+'.webp',name+'.png')
          s=s.replace("const AIRPORT=te('bg_airport_departure_day.webp');", "const AIRPORT=te('bg_airport_departure_day.png');").replace("const OWNER=te('supervisor_normal.webp');", "const OWNER=te('shop_master_normal.png');").replace('supervisor_normal.webp','shop_master_normal.png')
          js.write_text(s,encoding='utf-8')
          PY
      - name: Install Zeng portraits for KEY01 to KEY04
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _site/character/zeng
          cp main-source/zeng/zeng_normal.png _site/character/zeng/zeng_normal_t2.png
          cp main-source/zeng/zeng_polite.png _site/character/zeng/zeng_polite_t2.png
          cp main-source/zeng/zeng_innocent.png _site/character/zeng/zeng_innocent_t2.png
          cp main-source/zeng/zeng_happy.png _site/character/zeng/zeng_happy_t2.png
          cp main-source/zeng/zeng_shock.png _site/character/zeng/zeng_shock_t2.png
          python -m pip install --quiet pillow
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          for p in sorted(Path('_site/character/zeng').glob('*_t2.png')):
              with Image.open(p) as im:
                  a=im.convert('RGBA').getchannel('A')
                  lo,hi=a.getextrema(); transparent=sum(1 for x in a.getdata() if x<255); total=im.width*im.height
                  print(f'{p.name}: alpha=({lo},{hi}), transparent={transparent}/{total}')
                  if transparent==0: raise SystemExit(f'{p}: no transparent pixels')
          PY
          python - <<'PY'
          from pathlib import Path
          import re
          js=Path('_site/zeng-route/zeng-route.js'); s=js.read_text(encoding='utf-8')
          sprite_map="const spriteMap={'zeng_normal':'character/zeng/zeng_normal_t2.png','zeng_polite':'character/zeng/zeng_polite_t2.png','zeng_innocent':'character/zeng/zeng_innocent_t2.png','zeng_happy':'character/zeng/zeng_happy_t2.png','zeng_surprised':'character/zeng/zeng_shock_t2.png','lin_annoyed':'scene-assets/lin-annoyed-transparent.png'};"
          s,count=re.subn(r'const spriteMap=.*?;',sprite_map,s,count=1,flags=re.S)
          if count!=1: raise SystemExit('Unable to locate spriteMap')
          s=s.replace("['旁白','回答快得像是早就準備好了.']","['旁白','回答快得像是早就準備好了。']")
          s=s.replace("['少年調查官','KEY02 那天十一點回家的事。']","['少年調查官','之前問我很晚回家那件事。']")
          old="const key04TrustExtra=[['曾子豪｜zeng_normal','……我爸上次去學校。'],['曾子豪｜zeng_normal','好像國中了吧。'],['少年調查官','很久了。'],['曾子豪｜zeng_normal','還好吧。'],['曾子豪｜zeng_normal','反正成績不要太難看。'],['曾子豪｜zeng_normal','不要又搞到法院。'],['曾子豪｜zeng_normal','他們其實也不太管。'],['少年調查官','你喜歡這樣？'],['曾子豪｜zeng_normal','滿爽的啊。'],['旁白','他停了一下。']];"
          new="const key04TrustExtra=[['曾子豪｜zeng_normal','……我爸上次去學校。'],['曾子豪｜zeng_normal','好像國中了吧。'],['少年調查官','很久了。'],['曾子豪｜zeng_normal','還好吧。'],['曾子豪｜zeng_normal','反正成績不要太難看。'],['曾子豪｜zeng_normal','不要又搞到法院。'],['曾子豪｜zeng_normal','他們其實也不太管。'],['少年調查官','你喜歡這樣？'],['曾子豪｜zeng_normal','滿爽的啊。'],['旁白','他停了一下。'],['曾子豪｜zeng_normal','……真的。'],['旁白','你沒有追問。'],['旁白','這一次，他也沒有立刻把話題轉回林澈身上。']];"
          if old not in s: raise SystemExit('Unable to locate key04TrustExtra block')
          s=s.replace(old,new)
          s=s.replace("b.innerHTML=`<strong>${String.fromCharCode(65+n)}｜${opt.label}</strong><br>${opt.text}`;","b.innerHTML=`<strong>${String.fromCharCode(65+n)}.</strong> ${opt.text}`;")
          js.write_text(s,encoding='utf-8')
          index=Path('_site/zeng-route/index.html'); html=index.read_text(encoding='utf-8'); html=re.sub(r'zeng-route\.js\?v=[^"\']+','zeng-route.js?v=key04-3',html); index.write_text(html,encoding='utf-8')
          PY
      - name: Verify Zeng KEY04
        shell: bash
        run: |
          set -euo pipefail
          test -s _site/zeng-route/index.html
          test -s _site/zeng-route/zeng-route.js
          test -s _site/character/zeng/zeng_shock_t2.png
          grep -q 'KEY04｜所以我那時候就知道了' _site/zeng-route/zeng-route.js
          grep -q '之前問我很晚回家那件事。' _site/zeng-route/zeng-route.js
          ! grep -q 'KEY02 那天十一點回家的事。' _site/zeng-route/zeng-route.js
          grep -q 'zeng_key02_choice' _site/zeng-route/zeng-route.js
          grep -q '你那時候第一句就問我知不知道規定' _site/zeng-route/zeng-route.js
          grep -q '以後有些事不要跟你講太細' _site/zeng-route/zeng-route.js
          grep -q '真的出事的時候，我要找的是會處理的人' _site/zeng-route/zeng-route.js
          grep -q '因為這種最難準備答案啊' _site/zeng-route/zeng-route.js
          grep -q '所以你一直都在測我' _site/zeng-route/zeng-route.js
          grep -q '我爸上次去學校' _site/zeng-route/zeng-route.js
          grep -q '……真的。' _site/zeng-route/zeng-route.js
          grep -q '你沒有追問。' _site/zeng-route/zeng-route.js
          grep -q '這一次，他也沒有立刻把話題轉回林澈身上。' _site/zeng-route/zeng-route.js
          grep -q 'ZENG KEY04 COMPLETE' _site/zeng-route/zeng-route.js
          grep -q 'key04-3' _site/zeng-route/index.html
          ! grep -q 'String.fromCharCode(65+n)}｜${opt.label}' _site/zeng-route/zeng-route.js
      - name: Keep GitHub Pages project paths valid
        run: touch _site/.nojekyll
      - name: Save verified playable snapshot
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _site/.git; cd _site; git init; git checkout -b web-snapshot
          git config user.name 'github-actions[bot]'; git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A; git commit -m 'Snapshot Zeng KEY04 trust dialogue restored'; git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"; git push --force origin web-snapshot
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
