name: Deploy Rebellious Youth test site

on:
  push:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout artwork branch
        uses: actions/checkout@v4
        with:
          ref: dev
          path: source
      - name: Checkout latest main artwork
        uses: actions/checkout@v4
        with:
          ref: main
          path: main-source
      - name: Restore playable snapshot
        uses: actions/checkout@v4
        with:
          ref: web-snapshot
          path: _site
      - name: Keep True Ending artwork current
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _site/true-ending
          cp source/cg_true01_kapok_call.png _site/true-ending/cg_true01_kapok_call.png
          cp source/cg_true02_airport_group.png _site/true-ending/cg_true02_airport_group.png
          cp source/cg_true02_airport_goodbye.png _site/true-ending/cg_true02_airport_goodbye.png
          cp source/lin_23_game_sprite.png _site/true-ending/lin_23_game_sprite.png
          cp source/zeng_23_game_sprite.png _site/true-ending/zeng_23_game_sprite.png
          cp source/rain_22_game_sprite.png _site/true-ending/rain_22_game_sprite.png
          cp main-source/bg_airport_departure_day.png _site/true-ending/bg_airport_departure_day.png
          cp main-source/shop_master_normal.png _site/true-ending/shop_master_normal.png
          python - <<'PY'
          from pathlib import Path
          js=Path('_site/true-ending/true-ending.js'); s=js.read_text(encoding='utf-8')
          for name in ['cg_true01_kapok_call','cg_true02_airport_group','cg_true02_airport_goodbye','lin_23_game_sprite','zeng_23_game_sprite','rain_22_game_sprite']:
              s=s.replace(name+'.webp',name+'.png')
          s=s.replace("const AIRPORT=te('bg_airport_departure_day.webp');", "const AIRPORT=te('bg_airport_departure_day.png');").replace("const OWNER=te('supervisor_normal.webp');", "const OWNER=te('shop_master_normal.png');").replace('supervisor_normal.webp','shop_master_normal.png')
          js.write_text(s,encoding='utf-8')
          PY
      - name: Install Zeng portraits and KEY05 KTV background
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _site/character/zeng
          cp main-source/zeng/zeng_normal.png _site/character/zeng/zeng_normal_t2.png
          cp main-source/zeng/zeng_polite.png _site/character/zeng/zeng_polite_t2.png
          cp main-source/zeng/zeng_innocent.png _site/character/zeng/zeng_innocent_t2.png
          cp main-source/zeng/zeng_happy.png _site/character/zeng/zeng_happy_t2.png
          cp main-source/zeng/zeng_shock.png _site/character/zeng/zeng_shock_t2.png
          cp main-source/zeng/zeng_cold.png _site/character/zeng/zeng_serious_t2.png
          cp main-source/bg_ktv_room_night.png _site/bg_ktv_room_night.png
          python -m pip install --quiet pillow
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          for p in sorted(Path('_site/character/zeng').glob('*_t2.png')):
              with Image.open(p) as im:
                  a=im.convert('RGBA').getchannel('A')
                  transparent=sum(1 for x in a.getdata() if x<255)
                  print(f'{p.name}: transparent={transparent}/{im.width*im.height}')
                  if transparent==0: raise SystemExit(f'{p}: no transparent pixels')
          PY
      - name: Implement Zeng KEY05
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re
          js=Path('_site/zeng-route/zeng-route.js'); s=js.read_text(encoding='utf-8')
          sprite_map="const spriteMap={'zeng_normal':'character/zeng/zeng_normal_t2.png','zeng_polite':'character/zeng/zeng_polite_t2.png','zeng_innocent':'character/zeng/zeng_innocent_t2.png','zeng_happy':'character/zeng/zeng_happy_t2.png','zeng_surprised':'character/zeng/zeng_shock_t2.png','zeng_serious':'character/zeng/zeng_serious_t2.png','lin_annoyed':'scene-assets/lin-annoyed-transparent.png','lin_guarded':'scene-assets/lin-annoyed-transparent.png','lin_surprised':'scene-assets/lin-annoyed-transparent.png','lin_normal':'scene-assets/lin-annoyed-transparent.png'};"
          s,count=re.subn(r'const spriteMap=.*?;',sprite_map,s,count=1,flags=re.S)
          if count!=1: raise SystemExit('Unable to locate spriteMap')
          old="5:{title:'KEY05｜一通電話',background:bg('bg_ktv_room_night.png'),steps:[['旁白','KTV 包廂外突然傳來很大的聲音。']]}"
          new="""5:{title:'KEY05｜一通電話',background:bg('bg_ktv_room_night.png'),steps:[
          ['旁白','晚上。'],['旁白','音樂唱到一半，隔壁突然傳來一聲巨響。'],['林澈｜lin_annoyed','又在吵。'],['曾子豪｜zeng_normal','唱你的啦。'],['旁白','第二聲比第一聲更近。'],['旁白','接著是玻璃碎掉的聲音。'],['林澈｜lin_guarded','……'],['曾子豪｜zeng_normal','我去看一下。'],['林澈｜lin_annoyed','你不要去湊熱鬧。'],['曾子豪｜zeng_normal','看出口啦。'],['旁白','門只開了一條縫。'],['旁白','走廊有人在罵。'],['旁白','有人被另一個人扶著，手臂和衣服上都是血。'],['曾子豪｜zeng_serious','……靠。'],['林澈｜lin_guarded','怎樣？'],['曾子豪｜zeng_serious','先不要出去。'],['旁白','他把門關回來。'],['林澈｜lin_guarded','後面不是有出口？'],['曾子豪｜zeng_serious','那邊也有人。'],['旁白','外面又是一聲碰撞。'],['林澈｜lin_guarded','報警？'],['曾子豪｜zeng_normal','店家應該報了。'],['旁白','曾子豪拿出手機。'],['林澈｜lin_surprised','你打給誰？'],['曾子豪｜zeng_normal','……'],['旁白','電話接通。'],['少年調查官｜電話','喂？'],['曾子豪｜電話','欸。'],['少年調查官｜電話','曾子豪？'],['曾子豪｜電話','你現在忙嗎？'],['少年調查官｜電話','怎麼了？'],['曾子豪｜電話','我們在唱歌。'],['少年調查官｜電話','……然後？'],['曾子豪｜電話','隔壁有人打起來。'],['曾子豪｜電話','有人流血。'],['旁白','電話另一頭安靜了一瞬間。'],['少年調查官｜電話','你們兩個有沒有受傷？'],['曾子豪｜電話','沒有。'],['少年調查官｜電話','現在在哪個包廂？'],['少年調查官｜電話','包廂號碼。'],['曾子豪｜電話','507。'],['少年調查官｜電話','門先鎖好。'],['少年調查官｜電話','不要出去看。'],['少年調查官｜電話','店家或警察叫你們撤離再走。'],['少年調查官｜電話','我現在過去。'],['曾子豪｜電話','……喔。'],['旁白','電話掛掉。'],['林澈｜lin_surprised','他真的要來？'],['曾子豪｜zeng_normal','他自己說的啊。'],['林澈｜lin_normal','喔。'],['旁白','等現場終於安靜下來時，警察已經到了。'],['旁白','你在人群外找到兩個少年。'],['旁白','一路跑上樓，連呼吸都還沒喘勻。'],['少年調查官','有沒有受傷？'],['林澈｜lin_normal','沒有。'],['少年調查官','曾子豪？'],['曾子豪｜zeng_surprised','……'],['少年調查官','怎麼了？'],['曾子豪｜zeng_happy','沒有。'],['曾子豪｜zeng_happy','就覺得滿神奇的。'],['少年調查官','什麼？'],['曾子豪｜zeng_normal','竟然真的會有人因為一通電話——'],['曾子豪｜zeng_happy','跑得滿頭大汗。'],['少年調查官','……'],['林澈｜lin_annoyed','你現在還有心情笑喔。'],['曾子豪｜zeng_happy','不然咧。'],['少年調查官','先下樓。'],['曾子豪｜zeng_normal','喔。'],['旁白','他把手機收回口袋。'],['旁白','這一次，他沒有說「其實不用來」。'],['SYSTEM','ZENG KEY05 COMPLETE'],['SYSTEM','ZENG SERIES COMPLETE']]}"""
          if old not in s: raise SystemExit('Unable to locate KEY05 placeholder')
          s=s.replace(old,new)
          s=s.replace("['少年調查官','KEY02 那天十一點回家的事。']","['少年調查官','之前問我很晚回家那件事。']")
          old_extra="const key04TrustExtra=[['曾子豪｜zeng_normal','……我爸上次去學校。'],['曾子豪｜zeng_normal','好像國中了吧。'],['少年調查官','很久了。'],['曾子豪｜zeng_normal','還好吧。'],['曾子豪｜zeng_normal','反正成績不要太難看。'],['曾子豪｜zeng_normal','不要又搞到法院。'],['曾子豪｜zeng_normal','他們其實也不太管。'],['少年調查官','你喜歡這樣？'],['曾子豪｜zeng_normal','滿爽的啊。'],['旁白','他停了一下。']];"
          new_extra="const key04TrustExtra=[['曾子豪｜zeng_normal','……我爸上次去學校。'],['曾子豪｜zeng_normal','好像國中了吧。'],['少年調查官','很久了。'],['曾子豪｜zeng_normal','還好吧。'],['曾子豪｜zeng_normal','反正成績不要太難看。'],['曾子豪｜zeng_normal','不要又搞到法院。'],['曾子豪｜zeng_normal','他們其實也不太管。'],['少年調查官','你喜歡這樣？'],['曾子豪｜zeng_normal','滿爽的啊。'],['旁白','他停了一下。'],['曾子豪｜zeng_normal','……真的。'],['旁白','你沒有追問。'],['旁白','這一次，他也沒有立刻把話題轉回林澈身上。']];"
          if old_extra in s: s=s.replace(old_extra,new_extra)
          s=s.replace("b.innerHTML=`<strong>${String.fromCharCode(65+n)}｜${opt.label}</strong><br>${opt.text}`;","b.innerHTML=`<strong>${String.fromCharCode(65+n)}.</strong> ${opt.text}`;")
          s=s.replace("if(st[0]==='SYSTEM'){localStorage.setItem(`zeng_key0${id}_complete`,'true');", "if(st[0]==='SYSTEM'){localStorage.setItem(`zeng_key0${id}_complete`,'true');if(st[1]==='ZENG SERIES COMPLETE')localStorage.setItem('zeng_series_complete','true');")
          js.write_text(s,encoding='utf-8')
          index=Path('_site/zeng-route/index.html')
          html=index.read_text(encoding='utf-8')
          html=re.sub(r"zeng-route\.js\?v=[^\"']+", 'zeng-route.js?v=key05-2', html)
          index.write_text(html,encoding='utf-8')
          PY
      - name: Verify Zeng KEY05
        shell: bash
        run: |
          set -euo pipefail
          test -s _site/bg_ktv_room_night.png
          test -s _site/character/zeng/zeng_serious_t2.png
          grep -q 'KEY05｜一通電話' _site/zeng-route/zeng-route.js
          grep -q '音樂唱到一半，隔壁突然傳來一聲巨響。' _site/zeng-route/zeng-route.js
          grep -q '你現在忙嗎？' _site/zeng-route/zeng-route.js
          grep -q '包廂號碼。' _site/zeng-route/zeng-route.js
          grep -q '507。' _site/zeng-route/zeng-route.js
          grep -q '竟然真的會有人因為一通電話——' _site/zeng-route/zeng-route.js
          grep -q '跑得滿頭大汗。' _site/zeng-route/zeng-route.js
          grep -q '這一次，他沒有說「其實不用來」。' _site/zeng-route/zeng-route.js
          grep -q 'ZENG KEY05 COMPLETE' _site/zeng-route/zeng-route.js
          grep -q 'ZENG SERIES COMPLETE' _site/zeng-route/zeng-route.js
          grep -q 'zeng_series_complete' _site/zeng-route/zeng-route.js
          grep -q 'key05-2' _site/zeng-route/index.html
      - name: Keep GitHub Pages project paths valid
        run: touch _site/.nojekyll
      - name: Save verified playable snapshot
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _site/.git; cd _site; git init; git checkout -b web-snapshot
          git config user.name 'github-actions[bot]'; git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A; git commit -m 'Snapshot Zeng KEY05 complete'; git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"; git push --force origin web-snapshot
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
