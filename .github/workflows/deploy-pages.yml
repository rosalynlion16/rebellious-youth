name: Deploy Rebellious Youth test site

on:
  push:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout artwork branch
        uses: actions/checkout@v4
        with:
          ref: dev
          path: source

      - name: Checkout latest main artwork
        uses: actions/checkout@v4
        with:
          ref: main
          path: main-source

      - name: Restore playable snapshot
        uses: actions/checkout@v4
        with:
          ref: web-snapshot
          path: _site

      - name: Keep True Ending artwork current
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _site/true-ending
          cp source/cg_true01_kapok_call.png _site/true-ending/cg_true01_kapok_call.png
          cp source/cg_true02_airport_group.png _site/true-ending/cg_true02_airport_group.png
          cp source/cg_true02_airport_goodbye.png _site/true-ending/cg_true02_airport_goodbye.png
          cp source/lin_23_game_sprite.png _site/true-ending/lin_23_game_sprite.png
          cp source/zeng_23_game_sprite.png _site/true-ending/zeng_23_game_sprite.png
          cp source/rain_22_game_sprite.png _site/true-ending/rain_22_game_sprite.png
          cp main-source/bg_airport_departure_day.png _site/true-ending/bg_airport_departure_day.png
          cp main-source/shop_master_normal.png _site/true-ending/shop_master_normal.png
          python - <<'PY'
          from pathlib import Path
          js=Path('_site/true-ending/true-ending.js')
          s=js.read_text(encoding='utf-8')
          for name in ['cg_true01_kapok_call','cg_true02_airport_group','cg_true02_airport_goodbye','lin_23_game_sprite','zeng_23_game_sprite','rain_22_game_sprite']:
              s=s.replace(name+'.webp',name+'.png')
          s=s.replace("const AIRPORT=te('bg_airport_departure_day.webp');", "const AIRPORT=te('bg_airport_departure_day.png');")
          s=s.replace("const OWNER=te('supervisor_normal.webp');", "const OWNER=te('shop_master_normal.png');")
          s=s.replace('supervisor_normal.webp','shop_master_normal.png')
          js.write_text(s,encoding='utf-8')
          PY

      - name: Keep Zeng artwork current
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _site/character/zeng
          cp main-source/zeng/zeng_normal.png _site/character/zeng/zeng_normal_t2.png
          cp main-source/zeng/zeng_polite.png _site/character/zeng/zeng_polite_t2.png
          cp main-source/zeng/zeng_innocent.png _site/character/zeng/zeng_innocent_t2.png
          cp main-source/zeng/zeng_happy.png _site/character/zeng/zeng_happy_t2.png
          cp main-source/zeng/zeng_shock.png _site/character/zeng/zeng_shock_t2.png
          cp main-source/zeng/zeng_cold.png _site/character/zeng/zeng_serious_t2.png
          cp main-source/bg_ktv_room_night.png _site/bg_ktv_room_night.png

      - name: Restore Zeng main-game integration
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error \
            https://raw.githubusercontent.com/rosalynlion16/rebellious-youth/d97b0e7008822927fdc49449777fff3b17a6d87f/zeng-integration.js \
            -o _site/zeng-integration.js
          python - <<'PY'
          from pathlib import Path
          p=Path('_site/index.html')
          s=p.read_text(encoding='utf-8')
          tag='<script src="/rebellious-youth/zeng-integration.js?v=2" defer></script>'
          if 'zeng-integration.js' not in s:
              s=s.replace('</body>', tag+'</body>')
          p.write_text(s,encoding='utf-8')
          PY

      - name: Install repeat-last-week schedule helper
        shell: bash
        run: |
          set -euo pipefail
          cp source/schedule-helper.js _site/schedule-helper.js
          python - <<'PY'
          from pathlib import Path
          p=Path('_site/index.html')
          s=p.read_text(encoding='utf-8')
          tag='<script src="/rebellious-youth/schedule-helper.js?v=1" defer></script>'
          if 'schedule-helper.js' not in s:
              s=s.replace('</body>', tag+'</body>')
          p.write_text(s,encoding='utf-8')
          PY

      - name: Verify Zeng route and main-game integration
        shell: bash
        run: |
          set -euo pipefail
          test -s _site/bg_ktv_room_night.png
          test -s _site/character/zeng/zeng_serious_t2.png
          test -s _site/zeng-route/zeng-route.js
          grep -q 'KEY05｜一通電話' _site/zeng-route/zeng-route.js
          grep -q '音樂唱到一半，隔壁突然傳來一聲巨響。' _site/zeng-route/zeng-route.js
          grep -q 'ZENG KEY05 COMPLETE' _site/zeng-route/zeng-route.js
          grep -q 'ZENG SERIES COMPLETE' _site/zeng-route/zeng-route.js
          grep -q 'FRIEND ZENG' _site/zeng-route/zeng-route.js
          grep -q 'speakerTab' _site/zeng-route/zeng-route.js
          test -s _site/zeng-integration.js
          grep -q 'zeng-route' _site/zeng-integration.js
          grep -q 'zeng-integration.js' _site/index.html

      - name: Verify repeat-last-week schedule helper
        shell: bash
        run: |
          set -euo pipefail
          test -s _site/schedule-helper.js
          grep -q '同上週行程' _site/schedule-helper.js
          grep -q 'last-weekday-plan' _site/schedule-helper.js
          grep -q 'schedule-helper.js' _site/index.html

      - name: Keep GitHub Pages project paths valid
        run: touch _site/.nojekyll

      - name: Save verified playable snapshot
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _site/.git
          cd _site
          git init
          git checkout -b web-snapshot
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Snapshot Zeng UI and repeat schedule helper'
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --force origin web-snapshot

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
