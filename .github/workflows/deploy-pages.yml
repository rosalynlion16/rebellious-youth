name: Deploy Rebellious Youth test site

on:
  push:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout artwork branch
        uses: actions/checkout@v4
        with:
          ref: dev
          path: source

      - name: Checkout latest main artwork
        uses: actions/checkout@v4
        with:
          ref: main
          path: main-source

      - name: Restore playable snapshot
        uses: actions/checkout@v4
        with:
          ref: web-snapshot
          path: _site

      - name: Install original True Ending PNG artwork
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _site/true-ending
          cp source/cg_true01_kapok_call.png _site/true-ending/cg_true01_kapok_call.png
          cp source/cg_true02_airport_group.png _site/true-ending/cg_true02_airport_group.png
          cp source/cg_true02_airport_goodbye.png _site/true-ending/cg_true02_airport_goodbye.png
          cp source/lin_23_game_sprite.png _site/true-ending/lin_23_game_sprite.png
          cp source/zeng_23_game_sprite.png _site/true-ending/zeng_23_game_sprite.png
          cp source/rain_22_game_sprite.png _site/true-ending/rain_22_game_sprite.png
          cp main-source/bg_airport_departure_day.png _site/true-ending/bg_airport_departure_day.png
          cp main-source/shop_master_normal.png _site/true-ending/shop_master_normal.png

          python - <<'PY'
          from pathlib import Path
          import re

          js=Path('_site/true-ending/true-ending.js')
          s=js.read_text(encoding='utf-8')
          for name in ['cg_true01_kapok_call','cg_true02_airport_group','cg_true02_airport_goodbye','lin_23_game_sprite','zeng_23_game_sprite','rain_22_game_sprite']:
              s=s.replace(name+'.webp',name+'.png')
          s=s.replace("const AIRPORT=te('bg_airport_departure_day.webp');", "const AIRPORT=te('bg_airport_departure_day.png');")
          s=s.replace("const OWNER=te('supervisor_normal.webp');", "const OWNER=te('shop_master_normal.png');")
          s=s.replace('supervisor_normal.webp','shop_master_normal.png')
          js.write_text(s,encoding='utf-8')

          index=Path('_site/index.html')
          html=index.read_text(encoding='utf-8')
          html=re.sub(r'true-ending/true-ending\.js\?v=[^"\']+', 'true-ending/true-ending.js?v=133', html)
          html=re.sub(r'true-ending/true-ending\.css\?v=[^"\']+', 'true-ending/true-ending.css?v=133', html)
          index.write_text(html,encoding='utf-8')
          PY

          file _site/true-ending/*.png
          test $(stat -c%s _site/true-ending/cg_true01_kapok_call.png) -gt 1000000
          test $(stat -c%s _site/true-ending/cg_true02_airport_group.png) -gt 1000000
          test $(stat -c%s _site/true-ending/cg_true02_airport_goodbye.png) -gt 1000000
          test $(stat -c%s _site/true-ending/bg_airport_departure_day.png) -gt 1000000
          test $(stat -c%s _site/true-ending/lin_23_game_sprite.png) -gt 500000
          test $(stat -c%s _site/true-ending/zeng_23_game_sprite.png) -gt 500000
          test $(stat -c%s _site/true-ending/rain_22_game_sprite.png) -gt 500000
          test -s _site/true-ending/shop_master_normal.png
          grep -q "bg_airport_departure_day.png" _site/true-ending/true-ending.js
          grep -q "shop_master_normal.png" _site/true-ending/true-ending.js
          grep -q 'true-ending.js?v=133' _site/index.html

      - name: Keep GitHub Pages project paths valid
        shell: bash
        run: |
          set -euo pipefail
          touch _site/.nojekyll

      - name: Save verified playable snapshot
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _site/.git
          cd _site
          git init
          git checkout -b web-snapshot
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Snapshot TE02 with updated shop master sprite v133'
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --force origin web-snapshot

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
