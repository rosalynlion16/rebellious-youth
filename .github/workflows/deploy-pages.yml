name: Deploy Rebellious Youth test site

on:
  push:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout artwork branch
        uses: actions/checkout@v4
        with:
          ref: dev
          path: source

      - name: Checkout latest main artwork
        uses: actions/checkout@v4
        with:
          ref: main
          path: main-source

      - name: Restore playable snapshot
        uses: actions/checkout@v4
        with:
          ref: web-snapshot
          path: _site

      - name: Keep True Ending artwork current
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _site/true-ending
          cp source/cg_true01_kapok_call.png _site/true-ending/cg_true01_kapok_call.png
          cp source/cg_true02_airport_group.png _site/true-ending/cg_true02_airport_group.png
          cp source/cg_true02_airport_goodbye.png _site/true-ending/cg_true02_airport_goodbye.png
          cp source/lin_23_game_sprite.png _site/true-ending/lin_23_game_sprite.png
          cp source/zeng_23_game_sprite.png _site/true-ending/zeng_23_game_sprite.png
          cp source/rain_22_game_sprite.png _site/true-ending/rain_22_game_sprite.png
          cp main-source/bg_airport_departure_day.png _site/true-ending/bg_airport_departure_day.png
          cp main-source/shop_master_normal.png _site/true-ending/shop_master_normal.png

          python - <<'PY'
          from pathlib import Path
          js=Path('_site/true-ending/true-ending.js')
          s=js.read_text(encoding='utf-8')
          for name in ['cg_true01_kapok_call','cg_true02_airport_group','cg_true02_airport_goodbye','lin_23_game_sprite','zeng_23_game_sprite','rain_22_game_sprite']:
              s=s.replace(name+'.webp',name+'.png')
          s=s.replace("const AIRPORT=te('bg_airport_departure_day.webp');", "const AIRPORT=te('bg_airport_departure_day.png');")
          s=s.replace("const OWNER=te('supervisor_normal.webp');", "const OWNER=te('shop_master_normal.png');")
          s=s.replace('supervisor_normal.webp','shop_master_normal.png')
          js.write_text(s,encoding='utf-8')
          PY

      - name: Install latest transparent Zeng character sprites
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _site/character/zeng
          cp main-source/zeng/zeng_normal.png _site/character/zeng/zeng_normal.png
          cp main-source/zeng/zeng_polite.png _site/character/zeng/zeng_polite.png
          cp main-source/zeng/zeng_innocent.png _site/character/zeng/zeng_innocent.png
          cp main-source/zeng/zeng_happy.png _site/character/zeng/zeng_happy.png

          python - <<'PY'
          from pathlib import Path
          for p in Path('_site/character/zeng').glob('*.png'):
              data=p.read_bytes()
              if data[:8] != b'\x89PNG\r\n\x1a\n':
                  raise SystemExit(f'{p}: not a PNG')
              color_type=data[25]
              has_alpha=color_type in (4,6) or b'tRNS' in data
              print(f'{p.name}: PNG color_type={color_type}, transparency={has_alpha}, bytes={len(data)}')
              if not has_alpha:
                  raise SystemExit(f'{p}: NO ALPHA/TRANSPARENCY - please replace with transparent portrait')
          PY

          python - <<'PY'
          from pathlib import Path
          import re
          js=Path('_site/zeng-route/zeng-route.js')
          s=js.read_text(encoding='utf-8')
          sprite_map = '''const spriteMap={
          'zeng_normal':'character/zeng/zeng_normal.png',
          'zeng_polite':'character/zeng/zeng_polite.png',
          'zeng_innocent':'character/zeng/zeng_innocent.png',
          'zeng_happy':'character/zeng/zeng_happy.png',
          'lin_annoyed':'scene-assets/lin-annoyed-transparent.png'
          };'''
          s, count = re.subn(r'const spriteMap=\{.*?\n\};', sprite_map, s, count=1, flags=re.S)
          if count != 1:
              raise SystemExit('Unable to locate Zeng spriteMap')
          js.write_text(s, encoding='utf-8')
          index=Path('_site/zeng-route/index.html')
          html=index.read_text(encoding='utf-8')
          html=re.sub(r'zeng-route\.js\?v=[^"\']+', 'zeng-route.js?v=narration3', html)
          index.write_text(html,encoding='utf-8')
          PY

      - name: Verify Zeng KEY01 route
        shell: bash
        run: |
          set -euo pipefail
          test -s _site/zeng-route/index.html
          test -s _site/zeng-route/zeng-route.js
          test -s _site/character/zeng/zeng_normal.png
          test -s _site/character/zeng/zeng_polite.png
          test -s _site/character/zeng/zeng_innocent.png
          test -s _site/character/zeng/zeng_happy.png
          test -s _site/scene-assets/lin-annoyed-transparent.png
          grep -q '比較好管的那個' _site/zeng-route/zeng-route.js
          grep -q 'character/zeng/zeng_normal.png' _site/zeng-route/zeng-route.js
          grep -q 'setNarrationBox' _site/zeng-route/zeng-route.js
          grep -q 'narration3' _site/zeng-route/index.html

      - name: Keep GitHub Pages project paths valid
        shell: bash
        run: |
          set -euo pipefail
          touch _site/.nojekyll

      - name: Save verified playable snapshot
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _site/.git
          cd _site
          git init
          git checkout -b web-snapshot
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Snapshot Zeng KEY01 with transparent sprites and centered narration'
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --force origin web-snapshot

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
